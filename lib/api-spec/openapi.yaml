    Pharmacy:
      type: object
      properties:
        id:
          type: number
        userId:
          type: number
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        licenseNumber:
          type: ["string", "null"]
        openingHours:
          type: ["string", "null"]
        status:
          type: string
      required:
        - id
        - userId
        - name
        - email
        - status

    PharmacyUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        licenseNumber:
          type: string
        openingHours:
          type: string

    PharmacyDashboard:
      type: object
      properties:
        userName:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        firstName:
