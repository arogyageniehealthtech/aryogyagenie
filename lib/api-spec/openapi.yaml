        followUpAnswers:
          type: ["object", "null"]
          additionalProperties: true
        riskFactors:
          type: ["array", "null"]
          items:
            type: string
        structuredAssessment:
          type: ["object", "null"]
          additionalProperties: true
        sources:
          type: ["array", "null"]
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
      required:
        - id
        - patientId
        - symptoms
        - createdAt

    SymptomAssessmentInput:
      type: object
      required:
        - symptoms
      properties:
        symptoms:
          type: string
        severity:
          type: string
          enum: [mild, moderate, severe]
        duration:
          type: string
        additionalNotes:
          type: string
        followUpQuestions:
          type: array
          items:
            type: string
        followUpAnswers:
          type: object
          additionalProperties: true

    FollowUpQuestionsInput:
      type: object
      required:
        - symptoms
      properties:
        symptoms:
          type: string
        severity:
          type: string
          enum: [mild, moderate, severe]
        duration:
          type: string
        additionalNotes:
          type: string

    FollowUpQuestionsOutput:
      type: object
      required:
        - isEmergency
        - questions
      properties:
        isEmergency:
          type: boolean
        urgencyLevel:
          type: string
        emergencyMessage:
          type: string
        questions:
          type: array
          items:
            type: string
        patientContext:
          type: object
          additionalProperties: true

