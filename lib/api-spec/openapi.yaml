        qualification:
          type: string
        licenseNumber:
          type: string
        clinicName:
          type: string
        clinicAddress:
          type: string
        consultationFee:
          type: number
        experience:
          type: number
        bio:
          type: string
        availableDays:
          type: string
        availableHours:
          type: string

    DoctorDashboard:
      type: object
