        lastName:
          type: ["string", "null"]
        upcomingAppointments:
          type: number
        totalLabReports:
          type: number
        activeMedicines:
          type: number
        totalPrescriptions:
          type: number
        recentAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        recentLabReports:
          type: array
          items:
            $ref: "#/components/schemas/LabReport"
        activeMedicineReminders:
          type: array
