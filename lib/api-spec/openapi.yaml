              frequency:
                type: string
              instructions:
                type: string
            required:
              - name
        extractedLabValues:
          type: array
          items:
            type: object
            properties:
              testName:
                type: string
              value:
                type: string
              unit:
                type: string
              referenceRange:
                type: string
              isAbnormal:
                type: boolean
            required:
              - testName
              - value
              - isAbnormal
        confidenceScore:
          type: number
      required:
        - rawExtractedText
        - documentType
        - extractedMedicines
        - extractedLabValues
        - confidenceScore

