            $ref: "#/components/schemas/MedicineReminder"
      required:
        - upcomingAppointments
        - totalLabReports
        - activeMedicines
        - totalPrescriptions
        - recentAppointments
        - recentLabReports
        - activeMedicineReminders

    # ─── PRESCRIPTION ──────────────────────────────────────────────────────────
    Prescription:
      type: object
      properties:
        id:
          type: number
        patientId:
          type: number
        doctorId:
          type: number
        appointmentId:
          type: ["number", "null"]
        patientName:
          type: ["string", "null"]
        doctorName:
          type: ["string", "null"]
        medicines:
          type: string
        diagnosis:
          type: ["string", "null"]
        instructions:
          type: ["string", "null"]
