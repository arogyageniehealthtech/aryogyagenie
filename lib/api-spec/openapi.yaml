        totalLabReports:
          type: number
        totalRevenue:
          type: number
        pendingApprovals:
          type: number
        activeUsers:
          type: number
        appointmentsByStatus:
          type: object
          properties:
            pending:
              type: number
            confirmed:
              type: number
            completed:
              type: number
            cancelled:
              type: number
          required:
            - pending
            - confirmed
            - completed
            - cancelled
      required:
